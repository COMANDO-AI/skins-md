<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Original cinematic angular deep-space cockpit frame">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000207"/>
      <stop offset=".28" stop-color="#101724"/>
      <stop offset=".55" stop-color="#020611"/>
      <stop offset="1" stop-color="#192231"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#11243a"/><stop offset=".5" stop-color="#8bdcff"/><stop offset="1" stop-color="#11243a"/></linearGradient>
    <filter id="blueGlow"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="redGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="vents" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 14h18" stroke="#314052" stroke-width="3" opacity=".32"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="none"/>

  <!-- heavy outer canopy mass, with transparent central viewport cut by evenodd -->
  <path fill="url(#metal)" fill-rule="evenodd" opacity=".94" d="M0 0h1600v1000H0z
    M455 118h690l80 78 4 572-86 96H458l-84-96 2-572z
    M105 171h282l-55 68-2 556-226 77z
    M1212 171h283l1 701-227-77-3-556z"/>

  <!-- top command brow / identity pod -->
  <path d="M504 0h592l-64 82H568z" fill="#050a13" opacity=".98"/>
  <path d="M642 10h316l32 50-42 48H652l-42-48z" fill="#07111f" stroke="#254d73" stroke-width="4"/>
  <text x="800" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="33" font-weight="800" fill="#cce9ff" letter-spacing="4">COMMAND</text>
  <text x="800" y="77" text-anchor="middle" font-family="monospace" font-size="13" fill="#76e6ff" letter-spacing="3">SECURE CHANNEL</text>
  <g fill="#ff3b30" filter="url(#redGlow)"><rect x="595" y="34" width="48" height="8" rx="4"/><rect x="595" y="54" width="58" height="8" rx="4"/><rect x="948" y="34" width="48" height="8" rx="4"/><rect x="938" y="54" width="58" height="8" rx="4"/></g>

  <!-- glowing window geometry -->
  <path d="M455 118h690l80 78 4 572-86 96H458l-84-96 2-572z" fill="none" stroke="url(#edge)" stroke-width="7" opacity=".62" filter="url(#blueGlow)"/>
  <path d="M105 171h282l-55 68-2 556-226 77zM1212 171h283l1 701-227-77-3-556z" fill="none" stroke="#5ec7ff" stroke-width="5" opacity=".44" filter="url(#blueGlow)"/>
  <path d="M500 150h600M430 204h740M431 808h740M500 838h600" stroke="#18334d" stroke-width="22" stroke-linecap="round" opacity=".82"/>

  <!-- ribbed metal struts -->
  <g opacity=".72">
    <path d="M0 0h334l117 116-52 64L279 58H0zM1600 0h-334l-117 116 52 64 120-122h279z" fill="#020711"/>
    <path d="M0 1000h367l95-118-62-63-115 122H0zM1600 1000h-367l-95-118 62-63 115 122h285z" fill="#020711"/>
    <path d="M38 224h65v560H38zM1497 224h65v560h-65z" fill="url(#vents)" stroke="#0f1722" stroke-width="8"/>
  </g>

  <!-- bottom console ring and controls -->
  <path d="M0 1000v-128l230-86h233l94 92h486l94-92h232l231 86v128z" fill="url(#metal)" opacity=".97"/>
  <ellipse cx="800" cy="934" rx="220" ry="54" fill="#020711" stroke="#28364e" stroke-width="13"/>
  <ellipse cx="800" cy="934" rx="146" ry="31" fill="none" stroke="#59d9ff" stroke-width="3" opacity=".48" filter="url(#blueGlow)"/>
  <path d="M690 934h220M800 906v56M718 916l164 36M882 916l-164 36" stroke="#65d8ff" opacity=".5" stroke-width="2"/>
  <g filter="url(#redGlow)">
    <rect x="354" y="876" width="22" height="13" rx="3" fill="#ff3b30"/><rect x="392" y="891" width="18" height="13" rx="3" fill="#62d7ff"/><rect x="1189" y="876" width="22" height="13" rx="3" fill="#62d7ff"/><rect x="1231" y="891" width="18" height="13" rx="3" fill="#ff3b30"/>
    <rect x="82" y="804" width="12" height="54" rx="3" fill="#ff3b30"/><rect x="114" y="824" width="12" height="34" rx="3" fill="#62d7ff"/><rect x="1506" y="804" width="12" height="54" rx="3" fill="#ff3b30"/><rect x="1474" y="824" width="12" height="34" rx="3" fill="#62d7ff"/>
  </g>
</svg>
